    window.setLanguage = function(lang) {
        document.getElementById('btn-en').classList.remove('lang-active');
        document.getElementById('btn-th').classList.remove('lang-active');
        document.getElementById(`btn-${lang}`).classList.add('lang-active');
        document.querySelectorAll('[data-i18n]').forEach(el => {
            const key = el.getAttribute('data-i18n');
            if (translations[lang][key]) {
                if (el.tagName === 'INPUT') el.placeholder = translations[lang][key];
                else el.innerHTML = translations[lang][key];
            }
        });
    };

    window.setAuthMode = function(mode) {
        currentAuthMode = mode;
        const tabLogin = document.getElementById('tab-login');
        const tabSignup = document.getElementById('tab-signup');
        const currentLang = document.getElementById('btn-en').classList.contains('lang-active') ? 'en' : 'th';

        if (mode === 'login') {
            tabLogin.className = "text-xl font-bold text-[#1b3a24] border-b-2 border-[#1b3a24] pb-1 px-2 transition-all";
            tabSignup.className = "text-xl font-bold text-gray-400 border-b-2 border-transparent pb-1 px-2 transition-all";
            document.getElementById('field-username').classList.add('hidden');
            document.getElementById('field-terms').classList.add('hidden');
            document.getElementById('terms').required = false;
            document.getElementById('btn-submit').setAttribute('data-i18n', 'btnLogin');
            document.getElementById('btn-submit').innerHTML = translations[currentLang].btnLogin;
        } else {
            tabSignup.className = "text-xl font-bold text-[#1b3a24] border-b-2 border-[#1b3a24] pb-1 px-2 transition-all";
            tabLogin.className = "text-xl font-bold text-gray-400 border-b-2 border-transparent pb-1 px-2 transition-all";
            document.getElementById('field-username').classList.remove('hidden');
            document.getElementById('field-terms').classList.remove('hidden');
            document.getElementById('terms').required = true;
            document.getElementById('btn-submit').setAttribute('data-i18n', 'btnSignup');
            document.getElementById('btn-submit').innerHTML = translations[currentLang].btnSignup;
        }
    };

    setLanguage('en');
    setAuthMode('login');

    // ==========================================
    // ตรวจสอบล็อกอิน (รอตรวจสอบก่อนเปลี่ยนหน้า)
    // ==========================================
    onAuthStateChanged(auth, async (user) => {
        if (user) {
            activeUser = user;
            const displayName = user.displayName || "User";
            
            document.getElementById('home-display-name').textContent = displayName;
            document.getElementById('edit-display-name').value = displayName;

            let userPhoto = "https://via.placeholder.com/150"; 
            try {
                const docRef = doc(db, "users", user.uid);
                const docSnap = await getDoc(docRef);
                if (docSnap.exists() && docSnap.data().profileImage) {
                    userPhoto = docSnap.data().profileImage;
                }
            } catch (error) {
                console.log("No profile image found in DB");
            }

            document.getElementById('home-profile-pic').src = userPhoto;
            document.getElementById('edit-profile-pic').src = userPhoto;

            // ถ้าเป็นการโหลดครั้งแรก และพบว่าล็อกอินอยู่แล้ว ให้ข้ามไปหน้า Home เลย
            if (isInitialLoad) {
                navigate('page-home');
                isInitialLoad = false;
            }
        } else {
            activeUser = null;
            
            // ถ้าเป็นการโหลดครั้งแรก แต่ "ไม่ได้ล็อกอิน" ให้หน่วงเวลาหน้า Splash ไว้ 2.5 วิแล้วไปหน้า Login
            if (isInitialLoad) {
                setTimeout(() => {
                    if(document.getElementById('page-splash').classList.contains('active')) {
                        navigate('page-signup');
                    }
                }, 2500);
                isInitialLoad = false;
            }
        }
    });

    window.previewAndCompressImage = function(event) {
        const file = event.target.files[0];
        if (!file) return;

        const reader = new FileReader();
        reader.readAsDataURL(file);
        reader.onload = function(e) {
            const img = new Image();
            img.src = e.target.result;
            
            img.onload = function() {
                const canvas = document.createElement('canvas');
                const MAX_WIDTH = 200; 
                const MAX_HEIGHT = 200;
                let width = img.width;
                let height = img.height;

                if (width > height) {
                    if (width > MAX_WIDTH) { height *= MAX_WIDTH / width; width = MAX_WIDTH; }
                } else {
                    if (height > MAX_HEIGHT) { width *= MAX_HEIGHT / height; height = MAX_HEIGHT; }
                }

                canvas.width = width;
                canvas.height = height;
                const ctx = canvas.getContext('2d');
                ctx.drawImage(img, 0, 0, width, height);

                tempPhotoDataURL = canvas.toDataURL('image/jpeg', 0.6);
                document.getElementById('edit-profile-pic').src = tempPhotoDataURL;
            }
        }
    }

    document.getElementById('btn-save-profile').addEventListener('click', async () => {
        if (!activeUser) return;
        
        const newDisplayName = document.getElementById('edit-display-name').value;
        const currentLang = document.getElementById('btn-en').classList.contains('lang-active') ? 'en' : 'th';
        const btnSave = document.getElementById('btn-save-profile');
        const originalBtnHTML = btnSave.innerHTML;

        try {
            btnSave.innerHTML = `<i class="fa-solid fa-spinner fa-spin mr-2"></i> ${translations[currentLang].saving}`;
            btnSave.disabled = true;

            const updateTasks = [];

            if (activeUser.displayName !== newDisplayName) {
                updateTasks.push(updateProfile(activeUser, { displayName: newDisplayName }));
            }

            if (tempPhotoDataURL) {
                const userDocRef = doc(db, "users", activeUser.uid);
                updateTasks.push(setDoc(userDocRef, { profileImage: tempPhotoDataURL }, { merge: true }));
            }

            if (updateTasks.length > 0) await Promise.all(updateTasks);

            document.getElementById('home-display-name').textContent = newDisplayName;
            if (tempPhotoDataURL) document.getElementById('home-profile-pic').src = tempPhotoDataURL;
            tempPhotoDataURL = null; 

            navigate('page-home');
        } catch (error) {
            alert("เกิดข้อผิดพลาด: " + error.message);
        } finally {
            btnSave.innerHTML = originalBtnHTML;
            btnSave.disabled = false;
        }
    });

    document.getElementById('auth-form').addEventListener('submit', (e) => {
        e.preventDefault();
        const email = document.getElementById('email').value;
        const password = document.getElementById('password').value;
        
        if (currentAuthMode === 'login') {
            signInWithEmailAndPassword(auth, email, password)
                .then(() => { navigate('page-home'); })
                .catch(() => alert("อีเมลหรือรหัสผ่านไม่ถูกต้อง"));
        } else {
            createUserWithEmailAndPassword(auth, email, password)
                .then((userCredential) => { 
                    // อัปเดตชื่อผู้ใช้ทันทีที่สมัครเสร็จ
                    updateProfile(userCredential.user, { displayName: document.getElementById('username').value })
                        .then(() => navigate('page-home'));
                })
                .catch((error) => alert("เกิดข้อผิดพลาด: " + error.message));
        }
    });

    // ==========================================
    // ฟังก์ชันออกจากระบบ (Logout)
    // ==========================================
    window.logoutApp = function() {
        signOut(auth).then(() => {
            navigate('page-signup');
        }).catch((error) => {
            console.error("Logout Error:", error);
        });
    };

    window.navigate = function(targetPageId) {
        document.querySelectorAll('.page').forEach(page => page.classList.remove('active', 'page-flex'));
        const targetPage = document.getElementById(targetPageId);
        
        if (targetPageId === 'page-splash') targetPage.classList.add('active', 'page-flex'); 
        else targetPage.classList.add('active');

        const bottomNav = document.getElementById('bottom-nav');
        if (targetPageId === 'page-splash' || targetPageId === 'page-signup' || targetPageId === 'page-profile') {
            bottomNav.classList.add('hidden');
        } else {
            bottomNav.classList.remove('hidden');
            updateBottomNavUI(targetPageId);
        }
    };

    function updateBottomNavUI(activePageId) {
        document.querySelectorAll('#bottom-nav .nav-item').forEach(item => {
            item.className = 'flex flex-col items-center flex-1 cursor-pointer nav-item group text-gray-300';
            item.querySelector('.icon-bg').className = 'w-12 h-12 rounded-full flex items-center justify-center text-2xl transition-all duration-300 icon-bg';
            item.querySelector('.nav-text').className = 'text-xs mt-1 nav-text group-hover:text-white';
        });

        const navMap = { 'page-home': 'nav-home', 'page-history': 'nav-history', 'page-rewards': 'nav-rewards', 'page-setting': 'nav-setting' };
        if (navMap[activePageId]) {
            const activeNav = document.getElementById(navMap[activePageId]);
            activeNav.className = 'flex flex-col items-center flex-1 cursor-pointer nav-item group';
            activeNav.querySelector('.icon-bg').className = 'w-12 h-12 rounded-full flex items-center justify-center text-2xl transition-all duration-300 icon-bg bg-[#eaffea] text-[#1b3a24] shadow-md relative top-[-10px]';
            activeNav.querySelector('.nav-text').className = 'text-xs mt-1 font-semibold nav-text text-white';
        }
    }
</script>
