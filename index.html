<!DOCTYPE html>
<html lang="th">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Binpoint - Home</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css" rel="stylesheet">
    <style>
        body {
            /* สีพื้นหลังแบบไล่ระดับตามภาพ */
            background: linear-gradient(135deg, #e6f7e6 0%, #d4f0d4 100%);
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        .mobile-container {
            max-width: 400px;
            margin: 0 auto;
            background: linear-gradient(180deg, #eaffea 0%, #d3f3d3 100%);
            min-height: 100vh;
            position: relative;
            box-shadow: 0 0 20px rgba(0,0,0,0.1);
            padding-bottom: 80px; /* เผื่อพื้นที่ให้ Bottom Nav */
            overflow-x: hidden;
        }
    </style>
</head>
<body class="bg-gray-100">

<div class="mobile-container">
    <!-- Header / Profile Section -->
    <div class="flex items-center p-6 pt-10">
        <div class="w-14 h-14 rounded-full bg-gray-300 overflow-hidden border-2 border-white shadow-sm">
            <!-- ใส่รูปโปรไฟล์ที่นี่ -->
            <img src="https://via.placeholder.com/150" alt="Profile" class="w-full h-full object-cover">
        </div>
        <div class="ml-4">
            <h1 class="text-xl font-bold text-gray-800">หมูเด้งเด้งเองจ้า</h1>
            <p class="text-sm text-gray-500 cursor-pointer">Profile &gt;</p>
        </div>
    </div>

    <!-- Points Card -->
    <div class="mx-5 bg-white rounded-2xl p-4 shadow-sm flex items-center">
        <div class="w-12 h-12 rounded-full bg-orange-400 flex items-center justify-center text-white text-xl shadow-inner">
            <i class="fa-solid fa-trash-can"></i>
        </div>
        <div class="ml-4">
            <div class="flex items-baseline">
                <span class="text-gray-500 text-sm mr-1">You have</span>
                <span class="text-2xl font-bold text-gray-800">555</span>
                <span class="text-lg font-bold text-gray-800 ml-1">points</span>
            </div>
            <p class="text-xs text-gray-500">Collect more to redeem rewards.</p>
        </div>
    </div>

    <!-- Banner Section -->
    <div class="mx-5 mt-6 relative rounded-2xl overflow-hidden bg-green-500 shadow-md">
        <!-- ใส่รูป Banner จริงที่นี่ -->
        <div class="p-5 text-white">
            <h2 class="text-3xl font-black italic">BINPOINT</h2>
            <p class="font-bold text-sm mt-1">Every point counts<br>every reward matters</p>
            <p class="text-xs mt-2 bg-green-600 inline-block px-2 py-1 rounded">สะสมพอยต์ได้ทุกวันกับ Binpoint</p>
        </div>
    </div>

    <!-- Participating Stores -->
    <div class="mt-6 mx-5">
        <h3 class="text-md font-bold text-gray-800 mb-3">Participating stores</h3>
        <!-- Horizontal Scroll Container -->
        <div class="flex space-x-3 overflow-x-auto pb-4 scrollbar-hide">
            <!-- Store 1 -->
            <div class="flex-shrink-0 w-24 flex flex-col items-center">
                <div class="w-20 h-20 bg-white rounded-2xl shadow-sm flex items-center justify-center text-3xl text-gray-700">
                    <i class="fa-solid fa-location-dot"></i>
                </div>
                <p class="text-xs font-bold text-center mt-2 text-gray-800">Near you</p>
            </div>
            <!-- Store 2 -->
            <div class="flex-shrink-0 w-24 flex flex-col items-center">
                <div class="w-20 h-20 bg-orange-100 rounded-2xl shadow-sm flex items-center justify-center p-2 text-center text-[#8b3a3a] font-serif font-bold leading-tight">
                    BREW<br>BLISS<br><span class="text-xs">Cafe</span>
                </div>
                <p class="text-xs font-bold text-center mt-2 text-gray-800">BREW BLISS<br>Cafe</p>
            </div>
            <!-- Store 3 -->
            <div class="flex-shrink-0 w-24 flex flex-col items-center">
                <div class="w-20 h-20 bg-blue-700 rounded-2xl shadow-sm flex items-center justify-center p-2 text-center text-white font-serif font-bold leading-tight">
                    Mini<br>MART
                </div>
                <p class="text-xs font-bold text-center mt-2 text-gray-800">Mini Mart</p>
            </div>
        </div>
    </div>

    <!-- Bottom Navigation -->
    <div class="absolute bottom-0 w-full bg-[#1b3a24] rounded-t-3xl flex justify-between items-center px-6 py-4 shadow-[0_-5px_15px_rgba(0,0,0,0.1)]">
        <!-- Home (Active) -->
        <div class="flex flex-col items-center flex-1 cursor-pointer relative top-[-10px]">
            <div class="w-12 h-12 bg-[#eaffea] rounded-full flex items-center justify-center text-[#1b3a24] text-xl shadow-md">
                <i class="fa-solid fa-house"></i>
            </div>
            <span class="text-white text-xs mt-1 font-semibold">Home</span>
        </div>
        <!-- Point -->
        <div class="flex flex-col items-center flex-1 cursor-pointer">
            <div class="w-10 h-10 flex items-center justify-center text-white text-xl">
                <i class="fa-regular fa-trash-can"></i>
            </div>
            <span class="text-white text-xs mt-1">Point</span>
        </div>
        <!-- Reward -->
        <div class="flex flex-col items-center flex-1 cursor-pointer">
            <div class="w-10 h-10 flex items-center justify-center text-white text-xl">
                <i class="fa-solid fa-gift"></i>
            </div>
            <span class="text-white text-xs mt-1">Reward</span>
        </div>
        <!-- Setting -->
        <div class="flex flex-col items-center flex-1 cursor-pointer">
            <div class="w-10 h-10 flex items-center justify-center text-white text-xl">
                <i class="fa-solid fa-gear"></i>
            </div>
            <span class="text-white text-xs mt-1">Setting</span>
        </div>
    </div>
</div>

</body>
</html>
